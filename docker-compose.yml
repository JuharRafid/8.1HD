services:

  mongo:
    image: mongo:7
    container_name: study-buddy-mongo

    restart: unless-stopped

    ports:
      - "27018:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: study-buddy-app

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/studybuddy
      SESSION_SECRET: ${SESSION_SECRET}

    depends_on:
      mongo:
        condition: service_healthy


volumes:
  mongo_data: